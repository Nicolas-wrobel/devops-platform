global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'backend-service'
    metrics_path: '/actuator/prometheus'
    basic_auth:
      username_file: /run/secrets/prometheus_scrape_username
      password_file: /run/secrets/prometheus_scrape_password
    static_configs:
      - targets: ['backend:8080']
