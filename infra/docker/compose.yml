services:
  db:
    image: postgres:16.14
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.13.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    secrets:
      - prometheus_scrape_username
      - prometheus_scrape_password
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.wal-compression'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  grafana:
    image: grafana/grafana:13.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      # Data source + dashboards provisioned from the repo (ADR-0028),
      # read-only: the files in git are the source of truth.
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # ":?" makes compose refuse to start when a value is unset OR empty —
      # an empty credential/secret would otherwise fail silently later.
      PASSWORD_ENCODER_ID: ${PASSWORD_ENCODER_ID:?set it in infra/docker/.env.<env>, see .env.example}
      APP_ADMIN_USER: ${APP_ADMIN_USER:?set it in infra/docker/.env.<env>, see .env.example}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?set it in infra/docker/.env.<env>, see .env.example}
      PROMETHEUS_SCRAPE_USER: ${PROMETHEUS_SCRAPE_USER:?set it in infra/docker/.env.<env>, see .env.example}
      PROMETHEUS_SCRAPE_PASSWORD: ${PROMETHEUS_SCRAPE_PASSWORD:?set it in infra/docker/.env.<env>, see .env.example}
      JWT_SECRET: ${JWT_SECRET:?set it in infra/docker/.env.<env> (at least 32 characters), see .env.example}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  m2_cache:
  maven_target:

secrets:
  prometheus_scrape_username:
    file: ./secrets/prometheus_scrape_username
  prometheus_scrape_password:
    file: ./secrets/prometheus_scrape_password