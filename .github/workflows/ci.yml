name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw test

  backend-dependency-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Vulnerability data (NVD feed) is cached across runs — without it, every
      # run re-downloads the full feed, which is slow and rate-limited without
      # an NVD_API_KEY secret. continue-on-error for now: without that key this
      # job can be too flaky to gate merges on; revisit once one is configured
      # (https://nvd.nist.gov/developers/request-an-api-key) and this has been
      # observed to run reliably.
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-dependency-check-data
      - run: ./mvnw org.owasp:dependency-check-maven:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0 — v2 stops working once GitHub drops Node 20 (2026-09-16)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t backend:ci -f apps/backend/Dockerfile apps/backend
      - run: docker build -t frontend:ci -f apps/frontend/Dockerfile apps/frontend
      # Pinned to a commit SHA, not a tag: in March 2026, 76 of 77 trivy-action
      # tags were hijacked to ship a credential-stealing entrypoint.sh (see
      # GHSA-69fq-xp46-6x23). Only the 0.35.0 tag was unaffected (protected by
      # GitHub's immutable-releases feature) — this SHA is that tag's commit.
      - name: Scan backend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: backend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: frontend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
