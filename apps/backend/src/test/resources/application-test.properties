# Deliberately readable, not random: obviously fake, and a random-looking
# value next to "SECRET" trips gitleaks' generic-api-key rule in CI.
JWT_SECRET=test-only-jwt-secret-never-used-outside-tests

PASSWORD_ENCODER_ID=bcrypt
APP_ADMIN_USER=admin
APP_ADMIN_PASSWORD=adminpass

PROMETHEUS_SCRAPE_USER=prometheus
PROMETHEUS_SCRAPE_PASSWORD=prometheuspass

# Every Testcontainers-based test starts from an empty database (ADR-0009/0010).
app.demo-data.enabled=false