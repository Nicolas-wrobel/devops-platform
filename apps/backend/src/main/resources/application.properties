spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/POSTGRES_DB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:POSTGRES_USER}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true

deployment.simulation.min-duration-seconds=10
deployment.simulation.max-duration-seconds=30
deployment.simulation.success-probability=0.85