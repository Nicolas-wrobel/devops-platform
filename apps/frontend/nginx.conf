server {
    listen 80;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    location /api/ {
        # No trailing slash on the proxy_pass target: this forwards the
        # full incoming URI unchanged (including /api/...), matching how
        # backend controllers are mapped (e.g. /api/environments).
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
